<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <script>
    if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-mode");
    }
</script>
    <link rel="stylesheet" href="../style.css" />
    <script src="../script.js" defer></script>
  </head>
  <body class="projects-page">
    <header>
      <button id="menu-btn">☰</button>
      <h1>Projects</h1>
      <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="skills.html">Skills</a>
        <a href="education.html">Education</a>
        <a href="contact.html">Contact</a>
        <a href="resume.html">Resume</a>
      </nav>
      <button
    id="theme-toggle"
    type="button"
    aria-label="Switch to dark mode"
    aria-pressed="false"
>
    <span class="theme-icon theme-sun">☀️</span>
    <span class="theme-track"></span>
    <span class="theme-icon theme-moon">🌙</span>
    <span class="theme-knob"></span>
</button>
    </header>
    <main>
      <!-- ===== Project Search ===== -->

      <section class="project-controls">
        <label for="project-search">Search Projects</label>

        <input
          type="search"
          id="project-search"
          placeholder="Search by project name or technology..."
        />
        <p id="project-count" class="project-count"></p>

        <!-- ===== Project Filters ===== -->

        <section class="project-filters" aria-label="Project filters">
          <button
            type="button"
            class="filter-btn active"
            data-category="All"
            aria-pressed="true"
          >
            All
          </button>
          <button
            type="button"
            class="filter-btn"
            data-category="Web"
            aria-pressed="false"
          >
            Web
          </button>
          <button
            type="button"
            class="filter-btn"
            data-category="JavaScript"
            aria-pressed="false"
          >
            JavaScript
          </button>
          <button
            type="button"
            class="filter-btn"
            data-category="React"
            aria-pressed="false"
          >
            React
          </button>
          <button
            type="button"
            class="filter-btn"
            data-category="Other"
            aria-pressed="false"
          >
            Other
          </button>
        </section>
      </section>
      <!-- ===== Dynamic Project List ===== -->

      <ol id="projects-list"></ol>
      <!-- ===== Project Details Modal ===== -->

      <!-- ===== Project Details Modal ===== -->

      <section
        id="project-modal"
        class="project-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <article class="project-modal-content">
          <button
            id="modal-close"
            class="modal-close"
            type="button"
            aria-label="Close project details"
          >
            &times;
          </button>

          <h2 id="modal-title"></h2>

          <p id="modal-description"></p>

          <p>
            <b>Technologies:</b>
            <strong id="modal-technologies"></strong>
          </p>

          <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer">
            View Project
          </a>
        </article>
      </section>
    </main>
    <footer>
      <p>&copy; Rishabh_Pareek. All rights reserved.</p>

      <p>
        <a
          href="https://github.com/Rishabh8122004"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
        |
        <a
          href="https://www.linkedin.com/in/rishabh-pareek-6089a8275/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      </p>
    </footer>
  </body>
</html>
