<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <script>
    if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-mode");
    }
</script>
    <link rel="stylesheet" href="../style.css" />
    <script src="../script.js" defer></script>
  </head>
  <body class="contact-page">
    <header>
      <button id="menu-btn">☰</button>
      <h1>Contact Me</h1>
      <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="skills.html">Skills</a>
        <a href="education.html">Education</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
      </nav>
      <button
    id="theme-toggle"
    type="button"
    aria-label="Switch to dark mode"
    aria-pressed="false"
>
    <span class="theme-icon theme-sun">☀️</span>
    <span class="theme-track"></span>
    <span class="theme-icon theme-moon">🌙</span>
    <span class="theme-knob"></span>
</button>
    </header>
    <main>
      <h2>Get in Touch</h2>
      <p>Have a question or want to connect? Feel free to send me a message.</p>
      <form id="contact-form">
        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required />
        <small class="form-error" id="name-error"></small>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <small class="form-error" id="email-error"></small>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" />
        <small class="form-error" id="phone-error"></small>

        <!-- Subject -->
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" />
        <small class="form-error" id="subject-error"></small>

        <!-- Message -->
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="6" cols="40"></textarea>
        <small class="form-error" id="message-error"></small>

        <!-- Preferred Contact Method -->
        <p>Preferred Contact Method:</p>

        <!-- Preferred Contact Method -->
        <fieldset>
          <input
            type="radio"
            id="contact-email"
            name="contact-method"
            value="email"
          />
          <label for="contact-email">Email</label>

          <input
            type="radio"
            id="contact-phone"
            name="contact-method"
            value="phone"
          />
          <label for="contact-phone">Phone</label>
        </fieldset>
        <small class="form-error" id="contact-method-error"></small>
        <!-- Buttons -->
        <section>
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </section>

        <!-- Success Message -->
        <small class="form-success" id="form-success"></small>
      </form>
    </main>
    <footer>
      <p>&copy; Rishabh_Pareek. All rights reserved.</p>

      <p>
        <a
          href="https://github.com/Rishabh8122004"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
        |
        <a
          href="https://www.linkedin.com/in/rishabh-pareek-6089a8275/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      </p>
    </footer>
  </body>
</html>
